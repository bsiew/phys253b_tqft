known_risks:
  - "Style polish could hide unresolved sign, normalization, or convention issues."
  - "The project may accumulate references without a clear formal or writing target."
  - "The current review mixes pedagogical derivation, literature survey, and applications; expansion should preserve dependency order."
style_constraints:
  - "Organize by mathematical dependency, not generic motivation."
  - "Headings must name concrete mathematical objects, constructions, approximations, observables, mechanisms, or results."
  - "Define notation before use."
  - "Do not discuss consequences before deriving or stating the equations they depend on."
  - "Separate drafting from verification and final style polishing."
  - "Match the Brian Chern-Simons style where useful: physically motivated, mathematically explicit, and dense only when the density clarifies a derivation."
  - "Use theorem-like structure sparingly: statement, calculation, consequence."
  - "After important equations, add an interpretation paragraph explaining what the equation buys physically."
  - "Use source expansion rather than summary compression when modular TeX is shorter than the useful derivation density in the source reviews."
  - "Keep section and subsection titles short: topic labels only, usually 2-4 words and no more than 5 words when possible."
  - "Use a pedagogical rewrite pass after expansion: introduce each important calculation, then interpret it physically."
  - "Flag high-value figures directly in TeX and mirror reusable candidates into llm_docs."
